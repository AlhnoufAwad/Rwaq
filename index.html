<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>رواق الجمعيات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a platform shell (sticky bar + views) that hosts each association's subsite inside a browser-like frame; builder = form beside live preview. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --soft:#E6EEEA; --ink:#14231F; --muted:#56675F; --line:#D5DFDA;
  --accent:#0E5A4E; --accent-ink:#FFFFFF; --gold:#A87A22; --danger:#A33A2C; --ok:#2F7A4D;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1513; --surface:#13201C; --soft:#1A2A25; --ink:#E4EDE9; --muted:#93A69E; --line:#26372F;
  --accent:#43A890; --accent-ink:#04110D; --gold:#D6A647; --danger:#E07563; --ok:#5FBE85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#13201C; --soft:#1A2A25; --ink:#E4EDE9; --muted:#93A69E; --line:#26372F;
  --accent:#43A890; --accent-ink:#04110D; --gold:#D6A647; --danger:#E07563; --ok:#5FBE85; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);text-decoration:none}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost[aria-current="true"]{background:var(--soft);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding-block:28px 60px}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.lead{color:var(--muted);max-width:62ch}
.head-row{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.notice{background:var(--soft);border-radius:var(--r);padding:10px 14px;font-size:13.5px;color:var(--muted)}
.notice b{color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px}
textarea.input{min-height:84px;resize:vertical}
.filters .input{width:auto;min-width:0;flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .band{height:6px;background:var(--site,var(--accent))}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:19px}
.domain{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.ex{background:transparent;border:1px dashed var(--gold);color:var(--gold)}
.card .foot{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.meta{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink)}
/* editor */
.builder{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.builder{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.steps{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13.5px;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--soft);color:var(--accent);font-weight:600}
.form{padding:16px;display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.slug{display:flex;direction:ltr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.slug input{border:0;flex:1;min-width:0;padding:8px 10px;background:transparent;font-family:ui-monospace,Menlo,monospace}
.slug span{padding:8px 10px;background:var(--soft);color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:13px}
.rep{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.rep-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title h4{font-family:var(--body);font-size:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink)}
.err{color:var(--danger);font-size:13px}
.savebar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.preview-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.preview-wrap{position:static}}
/* subsite frame */
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.chrome{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px;direction:ltr}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.addr{flex:1;min-width:0;background:var(--surface);border-radius:6px;padding:3px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:ltr;text-align:left;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:var(--site);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none}
.s-name{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.3}
.s-name small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.s-nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.s-nav button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.s-nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--site)}
.s-hero{background:var(--site);color:#fff;padding:40px 24px;display:grid;gap:14px;position:relative;overflow:hidden}
.s-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 22px);pointer-events:none}
.s-hero > *{position:relative;z-index:1}
.s-hero h1{font-size:clamp(24px,4vw,36px);max-width:22ch}
.s-hero p{max-width:60ch;opacity:.92}
.s-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.s-hero .btn{background:#fff;color:#14231F;border-color:#fff}
.s-hero .btn.alt{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.s-sec{padding:28px 24px;display:grid;gap:16px;border-bottom:1px solid var(--line)}
.s-sec:last-child{border-bottom:0}
.s-sec h2{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--surface);padding:18px 24px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:13px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start;border-top:3px solid var(--site)}
.pcard h3{font-size:16px;font-family:var(--body);font-weight:600}
.pcard p{font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.license{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.license .seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--site);display:grid;place-items:center;flex:none;color:var(--site)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.doclist{display:grid;gap:8px}
.doc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.doc .ico{width:34px;height:40px;border-radius:4px;background:var(--soft);display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:700;flex:none}
.doc .t{flex:1;min-width:0}
.doc .t small{display:block;color:var(--muted);font-size:12.5px}
.vals{display:flex;gap:8px;flex-wrap:wrap}.vals span{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.role{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px}
.role .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.role .h small{font-weight:400;color:var(--muted);white-space:nowrap}
.role p{font-size:13.5px;color:var(--muted)}
.jform{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.ok-msg{color:var(--ok);font-weight:600}
.s-foot{padding:16px 24px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--soft)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--site,var(--accent))}}
/* ---- additions: registration, identity, templates, news, donations, dashboard ---- */
.badge{display:inline-block;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-weight:600}
.cta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phases{display:flex;gap:4px;padding:10px 10px 4px;margin:0;list-style:none;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.phases li{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 4px}
.phases li b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}
.phases li.on{color:var(--accent);font-weight:600}.phases li.on b{background:var(--accent);color:var(--accent-ink)}
.phases li.done{color:var(--ink)}.phases li.done b{color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:6px;accent-color:var(--accent)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl-thumb{width:52px;height:52px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);cursor:pointer;display:grid;gap:4px;text-align:right;align-content:start}
.tpl[aria-pressed="true"]{outline:2px solid var(--accent);border-color:var(--accent)}
.tpl b{font-size:13.5px}.tpl small{font-size:11.5px;color:var(--muted);line-height:1.4}
.mini{height:58px;border-radius:6px;border:1px solid var(--line);display:grid;gap:3px;padding:5px;background:var(--bg);overflow:hidden}
.mini i{display:block;border-radius:3px;background:var(--line)}
.mini.classic{grid-template-rows:6px 1fr 8px}.mini.classic i:nth-child(2){background:var(--site)}
.mini.modern{grid-template-rows:6px 1fr 8px}.mini.modern i:nth-child(1){width:60%;margin-inline-start:auto;border-radius:99px}.mini.modern i:nth-child(2){background:color-mix(in srgb,var(--site) 22%,var(--surface));border-radius:8px;margin-inline:4px}
.mini.formal{grid-template-rows:4px 8px 1fr;border-top:4px solid var(--site)}.mini.formal i:nth-child(1){width:30%;margin-inline:auto}.mini.formal i:nth-child(3){background:transparent;border:1px solid var(--site)}
.swatch.custom{position:relative;display:inline-block;overflow:hidden}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.devices{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.device-mobile{max-width:390px;margin-inline:auto}
.clist{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.clist li{display:flex;gap:8px;font-size:14px;align-items:center}
.clist li.ok::before{content:"✓";color:var(--ok);font-weight:700;width:14px}.clist li.no::before{content:"○";color:var(--muted);width:14px}
.dns{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.dns td,.dns th{direction:ltr;text-align:left}
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.logo.has-img{background:#fff;border:1px solid var(--line)}.logo.has-img span{display:none}
.vbadge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--muted);margin-top:4px}
.vbadge.ok,.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.chip.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
a.chip{text-decoration:none}
.ncard{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;align-content:start;background:var(--surface)}
.ncard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--soft)}
.ncard .in{padding:12px 14px;display:grid;gap:4px}
.ncard time{font-size:12px;color:var(--muted)}
.ncard h3{font-size:16px;font-family:var(--body);font-weight:600}
.ncard p{font-size:14px;color:var(--muted)}
.newslist{display:grid;gap:14px}
.ncard.wide .article p{color:var(--ink)}
.article{display:grid;gap:10px;max-width:72ch}.article h3{font-size:18px;margin-top:6px}
.groups{display:flex;gap:10px;flex-wrap:wrap}
.groups span{border:1px solid var(--line);border-top:3px solid var(--site);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--muted);min-width:120px}
.groups b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.camp{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--site)}
.camp .nums{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bank{border:1px dashed var(--site);border-radius:10px;padding:14px;display:grid;gap:10px}
.iban{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:right;font-size:15px;letter-spacing:.03em;overflow-wrap:anywhere}
.btn.give{background:var(--site);border-color:var(--site);color:#fff}
.donate-cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-inline-start:4px solid var(--site);border-radius:10px;padding:14px 16px}
.stcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.stc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;align-content:start;justify-items:start}
.stc .k{font-size:12.5px;color:var(--muted)}.stc .v{font-weight:600}
tr.new td{background:color-mix(in srgb,var(--gold) 9%,transparent)}
td.msg{max-width:36ch;white-space:pre-wrap;font-size:13.5px}
/* template: modern */
.t-modern .s-head{border-bottom:0;padding:18px 24px}
.t-modern .logo{border-radius:50%}
.t-modern .s-nav{background:var(--soft);border-radius:99px;padding:3px}
.t-modern .s-nav button{border-radius:99px}
.t-modern .s-nav button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.t-modern .s-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--site) 16%,var(--surface)),var(--surface));color:var(--ink);margin:0 16px;border-radius:18px;padding:48px 28px;border:1px solid var(--line)}
.t-modern .s-hero::after{background:radial-gradient(circle at 12% 30%,color-mix(in srgb,var(--site) 22%,transparent) 0 90px,transparent 91px)}
.t-modern .s-hero .eyebrow{color:var(--site)!important;opacity:1!important}
.t-modern .s-hero .btn{background:var(--site);color:#fff;border-color:var(--site);border-radius:99px}
.t-modern .s-hero .btn.alt{background:transparent;color:var(--site);border-color:var(--site)}
.t-modern .stats{background:transparent;gap:12px;padding:16px;border-bottom:0}

  const pub=await crypto.subtle.importKey("jwk",pubJwk,RSA,false,["encrypt"]);
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,new TextEncoder().encode(JSON.stringify(obj)));
  const k=await crypto.subtle.encrypt({name:"RSA-OAEP"},pub,await crypto.subtle.exportKey("raw",aes));
  return {k:b64(k),iv:b64(iv),c:b64(c)};
}
async function decryptWith(priv,enc){
  const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,unb64(enc.k));
  const aes=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(enc.iv)},aes,unb64(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadPriv(){
  if(privKey||state.mode!=="db"||!state.uid||!window.crypto?.subtle) return privKey;
  try{ const snap=await db.doc(`data/users/${state.uid}/keys`).get();
    if(snap.exists && snap.data().priv) privKey=await crypto.subtle.importKey("jwk",clone(snap.data().priv),RSA,false,["decrypt"]); }catch(_){}
  return privKey;
}
async function ensureKeys(){
  if(state.mode!=="db"||!state.uid||!window.crypto?.subtle) return null;
  const ref=db.doc(`data/users/${state.uid}/keys`); const snap=await ref.get();
  if(snap.exists && snap.data().pub && snap.data().priv){ await loadPriv(); return clone(snap.data().pub); }
  const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
  const pub=await crypto.subtle.exportKey("jwk",kp.publicKey), priv=await crypto.subtle.exportKey("jwk",kp.privateKey);
  await ref.set({pub,priv,createdAt:new Date().toISOString()});
  privKey=kp.privateKey; return pub;
}
/* ---------- routing ---------- */
function go(view, slug){
  if(view==="new" && !state.canEdit){ const m=mySite(); if(m) return startEdit(m); }
  state.view=view; state.slug=slug||null; state.errors={}; state.confirmDel=null; state.rejectFor=null;
  if(view==="new"){ state.draft=blank(); state.draft.plan=state.pickPlan||"free"; state.draft.mine=!state.canEdit; state.editingSlug=null; state.editingId=null; state.step=0; state.previewTab="home"; }
  if(view==="site"){ state.siteTab="home"; }
  if(view==="dash"){ state.dashSeen=state.lastSeen; markSeen(); }
  try{ const h = view==="site" ? "s-"+slug : view; if(location.hash.slice(1)!==h) history.replaceState(null,"","#"+h); }catch(e){}
  render(); window.scrollTo(0,0);
}
function startEdit(s){
  state.view="new"; state.draft=Object.assign(blank(),clone(s)); state.draft.mine=isMine(s);
  state.editingSlug=s.slug; state.editingId=s._id; state.step=0; state.errors={}; state.previewTab="home";
  try{history.replaceState(null,"","#new")}catch(_){}
  render(); window.scrollTo(0,0);
}
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h.startsWith("s-")) return go("site",h.slice(2));
  if(h==="apps") return go("apps");
  if(h==="dash") return go("dash");
  if(h==="verify") return go("verify");
  if(h==="welcome"||!h) return go("welcome");
  if(h==="new") return go("new");
  go("home");
}
async function markSeen(){
  const latest=state.mail.reduce((m,x)=>(x.at||"")>m?x.at:m,"");
  if(!latest||latest<=state.lastSeen) return;
  state.lastSeen=latest; updateNav();
  if(state.mode==="db"&&state.uid){ try{ await db.doc(`data/users/${state.uid}/prefs`).set({lastSeen:latest}); }catch(_){} }
}

  (s.pages||[]).forEach((p,i)=>{ if(p.title) t.push(["pg"+i,p.title]); });

}

async function setReview(id, patch){
  const cur=clone(state.reviews[id]||{}); const next=Object.assign(cur,patch,{by:state.uid||"",updatedAt:new Date().toISOString()});

  catch(e){ toast("تعذّر الحفظ"); }
  state.rejectFor=null; render();
}
async function setLead(id, patch){
  const cur=state.leads.find(l=>l._id===id); if(!cur) return;
  const next=Object.assign({},cur,patch); delete next._id;
  try{ if(state.mode==="db") await db.doc("leads/"+id).set(next); Object.assign(cur,patch); toast("حُفظ"); }catch(e){ toast("تعذّر الحفظ"); }
  render();
}

function fld(label,path,o={}){
  const v=getP(state.draft,path)??"";
  const id="d-"+path.replace(/\./g,"-");
  const err=state.errors[path];
  let ctl;
  if(o.select) ctl=`<select class="input" id="${id}" data-p="${path}">${o.select.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
  else if(o.area) ctl=`<textarea class="input" id="${id}" data-p="${path}" placeholder="${esc(o.ph||"")}">${esc(v)}</textarea>`;
  else ctl=`<input class="input" id="${id}" data-p="${path}" value="${esc(v)}" placeholder="${esc(o.ph||"")}" ${o.type?`type="${o.type}"`:""} ${o.ltr?'style="direction:ltr;text-align:right"':""}>`;
  return `<div class="field"><label for="${id}">${label}</label>${ctl}${o.hint?`<span class="hint">${o.hint}</span>`:""}${err?`<span class="err">${err}</span>`:""}</div>`;
}
function chk(label,path){ const v=!!getP(state.draft,path); const id="d-"+path.replace(/\./g,"-");
  return `<label class="check" for="${id}"><input type="checkbox" id="${id}" data-p="${path}" ${v?"checked":""}><span>${label}</span></label>${state.errors[path]?`<span class="err">${state.errors[path]}</span>`:""}`; }
function upl(label,path,kind,hint){
  const v=getP(state.draft,path), url=assetUrl(v), busy=state.uploading[path];
  const can = state.mode!=="db" || !!assets;
  const id="u-"+path.replace(/\./g,"-");
  return `<div class="field"><label for="${id}">${label}</label><div class="upl">
    ${url?(kind==="image"?`<img class="upl-thumb" src="${esc(url)}" alt="">`:`<a class="chip ok" href="${esc(url)}" target="_blank" rel="noopener">✓ ملف مرفوع</a>`):""}
    ${can?`<label class="btn sm" for="${id}">${busy?"جارٍ الرفع…":(url?"استبدال":"رفع ملف")}</label><input type="file" id="${id}" hidden data-up="${path}" data-kind="${kind}" accept="${kind==="image"?"image/png,image/jpeg,image/webp,image/svg+xml":"application/pdf"}">`:""}

function rep(key,title,itemLabel,fields){
  const arr=state.draft[key];
  const lim=LIMIT_OF[key]?PLANS[planKey(state.draft)][LIMIT_OF[key]]:Infinity, full=arr.length>=lim;
  return `<div class="field"><div class="sec-title"><h4>${title}${lim!==Infinity?` <small class="muted" style="font-weight:400">(${arr.length}/${lim})</small>`:""}</h4><button type="button" class="btn sm" data-add="${key}" ${full?"disabled":""}>+ إضافة</button></div>

async function onMail(snap){

      const row = v ? Object.assign({},v,{kind:v.kind||it.kind,at:v.at||it.at}) : {failed:true,kind:it.kind,at:it.at};
      if(privKey) mailCache.set(key,row);
      out.push(row); } }

async function boot(){
  fromHash();
  if(!window.claude||!window.claude.use){ return offline(); }
  try{
    const [d,u,a]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets")]);
    if(!d) return offline();
    db=d; user=u; assets=a; state.mode="db";
    if(u){ try{ state.uid=await u.id(); }catch(_){}
      try{ const ce=await u.canEdit(); state.canEdit=ce!==false; }catch(_){ state.canEdit=false; }
      try{ const w=await u.can("data.write"); state.canWrite=w!==false; }catch(_){ state.canWrite=true; } }
    else { state.canEdit=false; state.canWrite=false; }
    db.collection("sites").onSnapshot(snap=>{ state.sites=snap.docs.map(x=>Object.assign({},x.data(),{_id:x.id})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")); startOwner(); refresh(); },
      ()=>{ toast("انقطع الاتصال بقاعدة البيانات"); });
    db.collection("review").onSnapshot(snap=>{ const m={}; snap.docs.forEach(x=>m[x.id]=x.data()); state.reviews=m; refresh(); },()=>{});
    if(state.canEdit) db.collection("leads").onSnapshot(snap=>{ state.leads=snap.docs.map(x=>Object.assign({},x.data(),{_id:x.id})).sort((a,b)=>(b.at||"").localeCompare(a.at||"")); refresh(); },()=>{});
    if(state.canEdit && !INITIAL_HASH && state.view==="welcome") go("home");
    if(state.canEdit) db.collection("inbox").onSnapshot(snap=>{ state.inbox=snap.docs.flatMap(x=>x.data().apps||[]); refresh(); },()=>{});
    refresh();
  }catch(e){ offline(); }
}
const INITIAL_HASH=(location.hash||"").slice(1);
render(); boot();
})();

</script>

</body></html>
